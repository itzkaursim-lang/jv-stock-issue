<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JV Stock Issue</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#F4F6FB;--card:#FFFFFF;--line:#E6E9F2;--soft:#F8FAFD;--ink:#0F1629;--mute:#5E6A82;--ink2:#2B3550;
--brand:#0F1B3D;--brand2:#1C2E66;--gold:#E0B64F;--goldInk:#8A6410;--goldBg:#FFF4D6;
--ok:#10B981;--okBg:#DDFBEF;--okInk:#047857;--pt:#F59E0B;--ptBg:#FFF1D6;--ptInk:#B45309;--no:#F43F5E;--noBg:#FFE4EA;--noInk:#BE123C;
--info:#3B82F6;--infoBg:#E0ECFF;--infoInk:#1D4ED8;--gryBg:#EEF1F7}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:16.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:20px;font-weight:700}
h3{margin:0;font-size:17px;font-weight:700}
.sub{font-size:14.5px;color:var(--mute)}
main{padding:0 16px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.04)}
.pad{padding:16px 18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--brand);background:var(--card);color:var(--ink);font:600 15.5px 'Outfit',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1405}
.btn.ghost{border-color:var(--line)}
.btn.warn{border-color:var(--no);color:var(--no)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:16px;padding:14px}
.tile b{display:block;font-size:28px;line-height:1.15}
.tile span{font-size:14px;font-weight:500}
.t-ok{background:var(--okBg);color:var(--okInk)}.t-pt{background:var(--ptBg);color:var(--ptInk)}.t-no{background:var(--noBg);color:var(--noInk)}.t-in{background:var(--infoBg);color:var(--infoInk)}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;display:inline-block}
.c-ok{background:var(--okBg);color:var(--okInk)}.c-pt{background:var(--ptBg);color:var(--ptInk)}.c-no{background:var(--noBg);color:var(--noInk)}.c-gy{background:var(--gryBg);color:var(--ink2)}.c-in{background:var(--infoBg);color:var(--infoInk)}.c-gd{background:var(--goldBg);color:var(--goldInk)}
.sect{font-size:14.5px;font-weight:600;color:var(--mute);padding:6px 2px 0}
.tap{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card)}
.line{display:flex;flex-direction:column;gap:5px;padding:14px 18px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.note{font-size:14px;color:var(--mute)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.err{font-size:13px;color:var(--noInk);font-weight:600}
.okt{font-size:13px;color:var(--okInk);font-weight:600}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14.5px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:500 16px 'Outfit',sans-serif;color:var(--ink);background:var(--card);width:100%}
textarea{padding:10px 12px;min-height:70px}
input.bad{border-color:var(--no)}
.chk{display:flex;align-items:center;gap:10px;font-size:15.5px;min-height:46px}
.chk input{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-height:64px;border:0;background:none;font:500 13px 'Outfit',sans-serif;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on svg{color:var(--gold)}
.sheetbg{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92%;display:none}
.seg{display:flex;background:var(--gryBg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:46px;border:0;border-radius:10px;background:none;font:600 13.5px 'Outfit',sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--gryBg)}
.banner{border-radius:14px;padding:10px 12px;font-size:13.5px}
.hidden{display:none}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.appbar{position:sticky;top:0;z-index:15;background:radial-gradient(120% 140% at 0% 0%,#24324d 0%,#0F172A 55%,#0B1120 100%);color:#fff;padding:16px 16px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(15,23,42,.35);border-bottom:2px solid var(--gold)}
.appbar img.logo{width:46px;height:46px;border-radius:15px;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.35)}
.appbar .t{flex:1;min-width:0}
.appbar .t b{display:block;font-size:19px;white-space:nowrap;font-weight:700;letter-spacing:.01em;line-height:1.15}
.appbar .t span{display:block;font-size:13.5px;color:#C9CED6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.appbar .t span i{font-style:normal;color:var(--gold);font-weight:700}
.appbar .t em{display:inline-block;margin-top:5px;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0F172A;background:var(--gold);padding:2px 8px;border-radius:99px}
.lockbtn{width:44px;height:44px;border-radius:14px;border:1.5px solid rgba(201,162,75,.6);background:rgba(255,255,255,.08);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.lockbtn.open{background:var(--gold);color:#0F172A}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#334155;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;cursor:pointer;flex-shrink:0}
.avatar.big{width:76px;height:76px;font-size:28px}
.srow{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow .ic svg{width:20px;height:20px}
.srow .tx{flex:1;min-width:0}.srow .tx b{display:block;font-size:16px}.srow .tx span{font-size:13.5px;color:var(--mute)}
.chev{color:var(--mute);font-size:22px}
.scard{display:flex;align-items:stretch}
.scard .main{flex:1;min-width:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:16px 4px 16px 18px;display:flex;flex-direction:column;gap:8px}
.scard .side{display:flex;align-items:center;padding-right:10px}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

.ttl{font-size:18px;font-weight:700;letter-spacing:-.005em}
.meta{display:flex;flex-wrap:wrap;align-items:center;row-gap:2px;font-size:14px;color:var(--mute);min-width:0}
.meta i{display:inline-block;width:3px;height:3px;border-radius:50%;background:#B9B5AD;margin:0 8px}
.meta em{font-style:normal;color:var(--noInk);font-weight:600}
.unav{display:flex;gap:8px;align-items:flex-start;margin-top:2px;padding:9px 12px;border-radius:12px;background:#FDF3F4;color:var(--noInk);font-size:13.5px;line-height:1.5;border:1px solid #F4D4D9}
.unav svg{flex-shrink:0;margin-top:2px}
.unav b{font-weight:700}
.qty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cta{padding:0 18px 18px}
.chev{display:inline-flex;align-items:center}
.chip{letter-spacing:.01em}
.sheet>*{flex-shrink:0}

.menubtn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-right:-2px}
nav.tabs button.center{position:relative}
nav.tabs .fab{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:linear-gradient(160deg,#1B2540,#0B1220);color:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(11,18,32,.35),0 0 0 4px var(--bg),0 0 0 5.5px rgba(201,162,75,.6)}
nav.tabs .fab svg{width:26px;height:26px}
nav.tabs button.center.on{color:var(--brand)}
nav.tabs button.center.on .fab{background:linear-gradient(160deg,#E6C873,#C49A3A);color:#0B1220}
.dbg{position:fixed;inset:0;background:rgba(7,12,26,.5);z-index:50}
.dpanel{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);background:var(--bg);z-index:51;overflow:auto;box-shadow:12px 0 40px rgba(7,12,26,.35);padding-bottom:24px}
.dhead{display:flex;gap:12px;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;background:linear-gradient(160deg,#1B2540,#0B1220);color:#fff;border-bottom:2px solid var(--gold)}
.dhead img{width:52px;height:52px;border-radius:14px}
.dhead b{display:block;font-size:19px}.dhead span{font-size:13px;color:#C9CED6}
.dsect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--goldInk);padding:18px 18px 6px}
.ditem{display:flex;gap:14px;align-items:center;width:100%;padding:12px 18px;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ditem:active{background:var(--soft)}
.ditem .dic{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--brand);flex-shrink:0}
.ditem b{display:block;font-size:15.5px}.ditem span span{font-size:13px;color:var(--mute)}
.tcheck{width:30px;height:30px;border-radius:9px;border:2px solid #CFC8B8;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#fff}
.tcheck.on{background:var(--ok);border-color:var(--ok)}
.tmain{flex:1;min-width:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0}
.tmain b{display:block;font-size:15.5px}.tmain span{font-size:13px;color:var(--mute)}
.t-in b,.t-in span{color:var(--infoInk)}

.tile{background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0));box-shadow:inset 0 0 0 1px rgba(15,27,61,.04)}
.t-ok{background-color:#DDFBEF}.t-pt{background-color:#FFF1D6}.t-no{background-color:#FFE4EA}.t-in{background-color:#E0ECFF}
.card{border-color:#E6E9F2;box-shadow:0 1px 2px rgba(15,27,61,.04),0 8px 24px rgba(15,27,61,.06)}
.btn.main{background:linear-gradient(160deg,#1C2E66,#0F1B3D);border-color:#0F1B3D;box-shadow:0 6px 16px rgba(15,27,61,.22)}
.btn.gold{background:linear-gradient(160deg,#F2CF6B,#D9A93B);border-color:#D9A93B;color:#2A1C00;box-shadow:0 6px 16px rgba(217,169,59,.3)}
.appbar{background:radial-gradient(130% 160% at 0% 0%,#2A3F86 0%,#13235A 45%,#0B1430 100%)}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:2px 9px 2px 7px;border-radius:99px;border:0;font:600 11.5px 'Outfit',sans-serif;cursor:pointer;background:rgba(255,255,255,.1);color:#DCE3F2}
.sync .sd{width:8px;height:8px;border-radius:50%;background:#94A3B8}
.s-ok .sd{background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.s-pending .sd,.s-busy .sd{background:#FBBF24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.s-offline .sd{background:#94A3B8}.s-error .sd{background:#FB7185;box-shadow:0 0 0 3px rgba(251,113,133,.25)}
.appbar .t em{display:none}
.taskcard .thead b{font-size:18px}
.vbox{margin-top:6px;padding:10px 12px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.vhead{display:flex;align-items:center;gap:8px}.vhead b{flex:1}
.vbox input{min-height:44px;font-size:15px;padding:0 8px}
.sgroup{display:flex;align-items:center;gap:10px;padding:6px 2px 0}
.sgroup b{font-size:15px}.sgroup span:last-child{font-size:13.5px;color:var(--mute)}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.sdot.new{background:var(--info);box-shadow:0 0 0 4px var(--infoBg)}.sdot.cont{background:var(--pt);box-shadow:0 0 0 4px var(--ptBg)}
.contcard{border-left:4px solid var(--pt)}
.contline{font-size:13px;font-weight:600;color:var(--ptInk);background:var(--ptBg);border-radius:10px;padding:5px 10px;align-self:flex-start}
.slipline{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-radius:12px;background:var(--infoBg);color:var(--infoInk);font-size:14px}
.leftbox{border-top:1px solid var(--line);background:#FFFBF2;padding:10px 18px 12px}
.lefthead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ptInk);margin-bottom:4px}
.leftrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #F1E3C2}
.leftrow:last-child{border-bottom:0}.leftrow span span{display:block;font-size:12.5px;color:var(--mute)}
.hit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;font:inherit;color:inherit;cursor:pointer}
.hit span span{display:block;font-size:12.5px;color:var(--mute)}
input.bad{border-color:var(--no)}

/* v33 premium layer */
.pickbtn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px 'Outfit',sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,61,.05);max-width:100%}
.pickbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn.full{width:100%;min-height:50px;border-radius:14px;font-size:15.5px;font-weight:500}
.pickbtn svg{color:var(--goldInk);flex-shrink:0}
.pkbg{position:fixed;inset:0;background:rgba(7,12,26,.45);z-index:60;animation:fade .15s}
.pkpanel{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--card);border-radius:24px 24px 0 0;z-index:61;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(7,12,26,.3);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
.pkhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px 20px}.pkhead b{font-size:18px}
.pklist{overflow:auto;padding:0 8px 12px}
.pkitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:10px 14px;border:0;border-radius:14px;background:none;text-align:left;font:500 16px 'Outfit',sans-serif;color:var(--ink);cursor:pointer}
.pkitem small{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
.pkitem.on{background:var(--goldBg);color:var(--goldInk);font-weight:700}
.pkitem:active{background:var(--soft)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.hero{border-radius:24px;padding:18px 18px 14px;background:radial-gradient(130% 160% at 100% 0%,#2A3F86 0%,#13235A 50%,#0B1430 100%);color:#fff;box-shadow:0 14px 32px rgba(15,27,61,.28);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(224,182,79,.35),transparent 70%)}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hello{font-size:22px;white-space:nowrap;font-weight:700;letter-spacing:-.01em}.hdate{font-size:14px;color:#C9D3EC;margin-top:2px}
.hstock{flex-shrink:1;min-width:0;border:1px solid rgba(224,182,79,.5);background:rgba(255,255,255,.06);border-radius:14px;padding:6px 10px;color:#fff;text-align:right;font:inherit;cursor:pointer;max-width:48%}
.hstock span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}.hstock b{font-size:12.5px;font-weight:600}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hstats button{border:0;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;padding:10px 6px;text-align:center;font:inherit;cursor:pointer}
.hstats b{display:block;font-size:22px;font-weight:700;color:#F3DE9C}.hstats span{font-size:11.5px;color:#C9D3EC;line-height:1.2;display:block;margin-top:2px}
.qagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px;font:600 12.5px 'Outfit',sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(15,27,61,.05)}
.qa .qi{width:42px;height:42px;border-radius:13px;background:linear-gradient(160deg,#1C2E66,#0F1B3D);color:#F3DE9C;display:flex;align-items:center;justify-content:center}

/* animated highlight for the request you tapped */

input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid #CFCBDA;background:#fff;display:inline-grid;place-content:center;flex-shrink:0;cursor:pointer;transition:background .15s,border-color .15s;margin:0}
input[type=checkbox]:checked{background:#141414;border-color:#141414}
input[type=checkbox]:checked:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
input[type=checkbox]:focus-visible{box-shadow:0 0 0 4px rgba(185,167,255,.45)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.datebtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:18px;border:1.5px solid #E4E1EC;background:#fff;color:#141414;font:500 15.5px 'Outfit',sans-serif;cursor:pointer;text-align:left}
.datebtn svg{color:#8C7BE0;flex-shrink:0}.datebtn.empty span{color:#9A97A8}
.datebtn:active{transform:scale(.98)}
.fin .datebtn{padding-right:40px}
#cal .pkbg,#dlg .pkbg{z-index:80}
.calbox{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:81;background:#fff;border-radius:30px;padding:18px;box-shadow:0 20px 50px rgba(20,20,20,.3);animation:up .18s ease-out;display:flex;flex-direction:column;gap:12px}
.calhead{display:flex;align-items:center;justify-content:space-between}.calhead b{font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid.wk span{font-size:12px;font-weight:700;color:#9A97A8}
.cd{aspect-ratio:1;border:0;border-radius:50%;background:none;font:600 15px 'Outfit',sans-serif;color:#141414;cursor:pointer}
.cd.td{box-shadow:inset 0 0 0 1.5px #141414}.cd.on{background:#141414;color:#fff}.cd:active{background:#ECE6FF}
.dlgbox{position:fixed;left:20px;right:20px;top:50%;transform:translateY(-50%);z-index:81;background:#fff;border-radius:30px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(20,20,20,.3);display:flex;flex-direction:column;gap:14px;animation:fade .15s}
.dlgic{width:52px;height:52px;border-radius:50%;background:#ECE6FF;color:#4B3BA8;display:flex;align-items:center;justify-content:center}.dlgic.no{background:#FFD9E3;color:#8E1B3A}
.dlgmsg{font-size:17px;font-weight:600;line-height:1.4}
.btn.danger{background:#E11D48;border-color:#E11D48}
.rcard.sel:before{border-radius:26px}
.okbox{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:20px;background:#D6F5E5;color:#0B5E3D;font-weight:600}
.ireason{border-top:1px solid #F0EEF5}
.ireason summary{display:flex;align-items:center;gap:10px;padding:13px 18px;font-weight:600;font-size:15px}
.ireason summary b{font-size:15px}.ireason summary svg{color:var(--mute);transition:transform .2s}
.ireason[open] summary svg{transform:rotate(180deg)}
.ireason .tblwrap{padding:0 12px 12px}
.ireason table{font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.dot.no{background:#E11D48}.dot.gd{background:#F59E0B}
</style>
</head>
<body>
<div id="boot"><div class="ldbox"><div class="ldorb"><span class="o1"></span><span class="o2"></span><span class="o3"></span><img src="icon.png" alt=""></div><b>JV Stock Issue</b></div></div>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="hidden">
<input type="file" id="photoIn" accept="image/*" class="hidden">
<script src="app.js?v=4.2.1"></script>
</body>
</html>
