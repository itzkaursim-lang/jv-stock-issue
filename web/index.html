<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JV Stock Issue</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#F6F5F2;--card:#FFFFFF;--line:#E8E5DF;--soft:#FAF9F6;--ink:#14161A;--mute:#6B6F76;--ink2:#3A3E45;
--brand:#0F172A;--brand2:#1E293B;--gold:#C9A24B;--goldInk:#8A6A1F;--goldBg:#F7EFD9;
--ok:#0E7A4F;--okBg:#E3F4EC;--okInk:#0B5E3D;--pt:#B7791F;--ptBg:#FCF1DA;--ptInk:#8A5A00;--no:#B42335;--noBg:#FBE6E9;--noInk:#8E1B2A;
--info:#1D4ED8;--infoBg:#E5EDFD;--infoInk:#1E3A8A;--gryBg:#EFEDE8}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:16.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:20px;font-weight:700}
h3{margin:0;font-size:17px;font-weight:700}
.sub{font-size:14.5px;color:var(--mute)}
main{padding:0 16px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.04)}
.pad{padding:16px 18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--brand);background:var(--card);color:var(--ink);font:600 15.5px 'Outfit',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1405}
.btn.ghost{border-color:var(--line)}
.btn.warn{border-color:var(--no);color:var(--no)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14.5px;border-radius:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:16px;padding:14px}
.tile b{display:block;font-size:28px;line-height:1.15}
.tile span{font-size:14px;font-weight:500}
.t-ok{background:var(--okBg);color:var(--okInk)}.t-pt{background:var(--ptBg);color:var(--ptInk)}.t-no{background:var(--noBg);color:var(--noInk)}.t-in{background:var(--infoBg);color:var(--infoInk)}
.chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;display:inline-block}
.c-ok{background:var(--okBg);color:var(--okInk)}.c-pt{background:var(--ptBg);color:var(--ptInk)}.c-no{background:var(--noBg);color:var(--noInk)}.c-gy{background:var(--gryBg);color:var(--ink2)}.c-in{background:var(--infoBg);color:var(--infoInk)}.c-gd{background:var(--goldBg);color:var(--goldInk)}
.sect{font-size:14.5px;font-weight:600;color:var(--mute);padding:6px 2px 0}
.tap{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card)}
.line{display:flex;flex-direction:column;gap:5px;padding:14px 18px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.note{font-size:14px;color:var(--mute)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.err{font-size:13px;color:var(--noInk);font-weight:600}
.okt{font-size:13px;color:var(--okInk);font-weight:600}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14.5px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:500 16px 'Outfit',sans-serif;color:var(--ink);background:var(--card);width:100%}
textarea{padding:10px 12px;min-height:70px}
input.bad{border-color:var(--no)}
.chk{display:flex;align-items:center;gap:10px;font-size:15.5px;min-height:46px}
.chk input{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-height:64px;border:0;background:none;font:500 13px 'Outfit',sans-serif;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on svg{color:var(--gold)}
.sheetbg{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92%;display:none}
.seg{display:flex;background:var(--gryBg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:46px;border:0;border-radius:10px;background:none;font:600 13.5px 'Outfit',sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--gryBg)}
.banner{border-radius:14px;padding:10px 12px;font-size:13.5px}
.hidden{display:none}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.appbar{position:sticky;top:0;z-index:15;background:radial-gradient(120% 140% at 0% 0%,#24324d 0%,#0F172A 55%,#0B1120 100%);color:#fff;padding:16px 16px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(15,23,42,.35);border-bottom:2px solid var(--gold)}
.appbar img.logo{width:54px;height:54px;border-radius:15px;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.35)}
.appbar .t{flex:1;min-width:0}
.appbar .t b{display:block;font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.15}
.appbar .t span{display:block;font-size:13.5px;color:#C9CED6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.appbar .t span i{font-style:normal;color:var(--gold);font-weight:700}
.appbar .t em{display:inline-block;margin-top:5px;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0F172A;background:var(--gold);padding:2px 8px;border-radius:99px}
.lockbtn{width:44px;height:44px;border-radius:14px;border:1.5px solid rgba(201,162,75,.6);background:rgba(255,255,255,.08);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.lockbtn.open{background:var(--gold);color:#0F172A}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#334155;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;cursor:pointer;flex-shrink:0}
.avatar.big{width:76px;height:76px;font-size:28px}
.srow{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow .ic svg{width:20px;height:20px}
.srow .tx{flex:1;min-width:0}.srow .tx b{display:block;font-size:16px}.srow .tx span{font-size:13.5px;color:var(--mute)}
.chev{color:var(--mute);font-size:22px}
.scard{display:flex;align-items:stretch}
.scard .main{flex:1;min-width:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:16px 4px 16px 18px;display:flex;flex-direction:column;gap:8px}
.scard .side{display:flex;align-items:center;padding-right:10px}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--mute);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

.ttl{font-size:18px;font-weight:700;letter-spacing:-.005em}
.meta{display:flex;flex-wrap:wrap;align-items:center;row-gap:2px;font-size:14px;color:var(--mute);min-width:0}
.meta i{display:inline-block;width:3px;height:3px;border-radius:50%;background:#B9B5AD;margin:0 8px}
.meta em{font-style:normal;color:var(--noInk);font-weight:600}
.unav{display:flex;gap:8px;align-items:flex-start;margin-top:2px;padding:9px 12px;border-radius:12px;background:#FDF3F4;color:var(--noInk);font-size:13.5px;line-height:1.5;border:1px solid #F4D4D9}
.unav svg{flex-shrink:0;margin-top:2px}
.unav b{font-weight:700}
.qty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cta{padding:0 18px 18px}
.chev{display:inline-flex;align-items:center}
.chip{letter-spacing:.01em}
.sheet>*{flex-shrink:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="hidden">
<input type="file" id="photoIn" accept="image/*" class="hidden">
<script src="app.js?v=3.0.8"></script>
</body>
</html>
