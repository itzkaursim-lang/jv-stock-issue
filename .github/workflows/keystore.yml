name: Create signing key (run once)
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore jv.keystore -alias jv -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=JV Stock Issue, O=JV, C=IN"
          mkdir out
          base64 -w 0 jv.keystore > out/KEYSTORE_B64.txt
          printf "%s" "$PASS" > out/KEYSTORE_PASSWORD.txt
          cp jv.keystore out/jv.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out
          retention-days: 1
