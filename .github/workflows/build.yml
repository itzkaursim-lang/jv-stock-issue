name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::Signing key missing. Run the 'Create signing key' workflow once and add KEYSTORE_B64 and KEYSTORE_PASSWORD as repository secrets (see README)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Bundle the screens into the APK (offline copy and rollback)
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/* android/app/src/main/assets/www/
      - name: Decode signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/jv.keystore"
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/jv.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk JV-Stock-Issue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JV-Stock-Issue-apk
          path: JV-Stock-Issue.apk
          retention-days: 14
      - name: Publish release (used for in-app updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: JV Stock Issue 3.0.${{ github.run_number }}
          body: Built from ${{ github.sha }}. Install over the old version; your data stays.
          files: JV-Stock-Issue.apk
          make_latest: true
