{'name':'Build APK','on':{'workflow_dispatch':{},'push':{'branches':['main'],'paths':['android/**']}},'permissions':{'contents':'write'},'jobs':{'build':{'runs-on':'ubuntu-24.04','steps':[{'uses':'actions/checkout@v4'},{'uses':'actions/setup-java@v5','with':{'distribution':'temurin','java-version':'17'}},{'name':'Get Gradle','run':'wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O g.zip && unzip -q g.zip -d $RUNNER_TEMP && echo $RUNNER_TEMP/gradle-8.7/bin >> $GITHUB_PATH'},{'name':'Prepare','run':'echo sdk.dir=$ANDROID_HOME > android/local.properties && mkdir -p android/app/src/main/assets/www && cp -r web/* android/app/src/main/assets/www/'},{'name':'Key','env':{'KS':'${{ secrets.KEYSTORE_B64 }}'},'run':'echo $KS | base64 -d > $RUNNER_TEMP/jv.keystore'},{'name':'Build','env':{'KEYSTORE_FILE':'${{ runner.temp }}/jv.keystore','KEYSTORE_PASSWORD':'${{ secrets.KEYSTORE_PASSWORD }}'},'run':'gradle -p android assembleRelease --no-daemon --stacktrace && cp android/app/build/outputs/apk/release/app-release.apk JV-Stock-Issue.apk'},{'uses':'softprops/action-gh-release@v2','with':{'tag_name':'v3.0.${{ github.run_number }}','name':'JV Stock Issue 3.0.${{ github.run_number }}','files':'JV-Stock-Issue.apk','make_latest':'true'}}]}}}
